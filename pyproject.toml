[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-envs"
version = "0.1.0"
description = "Isaac Lab assets: robots, scenes and props, with their cfgs. No tasks."
# Isaac Sim 6.x and Isaac Lab 3.0 are 3.12 only.
requires-python = ">=3.12,<3.13"
# Empty on purpose: a lab that depends on this brings its own Isaac Lab.
dependencies = []

[dependency-groups]
# This repo's own environment, for converting and previewing assets: Isaac Lab
# 3.0 with Isaac Sim 6.2. The isaacsim extra pins isaacsim[all,extscache].
sim = [
    "isaaclab[isaacsim]",
    "torch==2.11.0",
    "torchvision==0.26.0",
]
dev = ["black==26.5.1"]

[tool.uv]
default-groups = ["sim", "dev"]
# Linux x86_64 only: the one platform this repo's sim environment is run on.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# NVIDIA and PyTorch indexes carry some of the same names as PyPI.
index-strategy = "unsafe-best-match"
prerelease = "allow"
# Isaac Lab's own overrides (release/3.0.0 pyproject.toml): Isaac Sim 6.2 pins
# older torch, Newton, USD and packaging versions than Isaac Lab 3.0 runs on.
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.1",
    "usd-optimize~=1.3.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "fsspec>=2026.6.0",
    "packaging>=20,<27",
    "urllib3>=2.8.0",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
# CUDA 13 wheels: torch 2.11 for Blackwell (sm_120), driver 580 or newer.
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# Isaac Lab 3.0's only wheel, 3.0.0rc1, targets Isaac Sim 6.1. Build the same
# aggregate package (all isaaclab_* packages, Kit apps, dependency metadata)
# from release/3.0.0 at a fixed commit, as Isaac Lab documents for unreleased
# revisions.
isaaclab = { git = "https://github.com/isaac-sim/IsaacLab.git", rev = "d061bf35a58273ef0cc8aceae76392166f9b7d15", subdirectory = "tools/wheel_builder" }

[tool.setuptools.packages.find]
include = ["isaac_envs*"]

[tool.black]
target-version = ["py312"]
